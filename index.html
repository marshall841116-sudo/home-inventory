<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>居家備品庫存管家</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" id="ios-app-title" content="備品庫存" />
  <meta name="theme-color" content="#09090b" />
  <link id="apple-touch-icon" rel="apple-touch-icon" href="" />
  <link id="app-favicon" rel="icon" type="image/png" href="" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
      padding-top: var(--sat);
      padding-bottom: calc(5.5rem + var(--sab));
    }

    input, select, textarea {
      font-size: 16px !important;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-modal {
      animation: modalIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    button {
      touch-action: manipulation;
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-zinc-950/85 backdrop-blur-xl border-b border-zinc-800/80">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div id="header-icon-preview" class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/20 shrink-0 text-lg font-bold">
          📦
        </div>
        <div class="min-w-0">
          <h1 id="header-title-text" class="text-base sm:text-lg font-bold tracking-tight text-zinc-100 truncate">居家備品庫存</h1>
          <p class="text-[11px] text-zinc-400 truncate">數量追蹤・存放位置管理</p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- 位置管理按鈕 -->
        <button onclick="openLocationModal()" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-300 border border-zinc-800 text-xs font-medium transition" title="管理存放位置">
          <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400"></i>
          <span>位置管理</span>
        </button>

        <!-- iOS 圖示 / 備份設定 -->
        <button onclick="openSettingsModal()" class="flex items-center gap-1.5 px-2.5 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 active:scale-95 text-zinc-300 border border-zinc-800 text-xs font-medium transition" title="iOS圖示與資料備份">
          <i data-lucide="smartphone" class="w-4 h-4 text-indigo-400"></i>
          <span class="hidden sm:inline">iOS圖示 / 備份</span>
          <span class="sm:hidden">設定</span>
        </button>

        <!-- 桌機新增按鈕 -->
        <button onclick="openItemModal()" class="hidden sm:flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-semibold shadow-lg shadow-indigo-600/25 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增備品</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 pt-5 space-y-5">

    <!-- 儀表板統計卡片 -->
    <section class="grid grid-cols-3 gap-2.5 sm:gap-3.5">
      <button onclick="setStockFilter('all')" id="stat-all" class="stat-card text-left p-3.5 rounded-2xl bg-zinc-900/90 border border-indigo-500/50 ring-1 ring-indigo-500/30 transition active:scale-[0.98]">
        <div class="flex items-center justify-between text-zinc-400 text-xs mb-1">
          <span>全部品項</span>
          <i data-lucide="layers" class="w-3.5 h-3.5 text-indigo-400"></i>
        </div>
        <div class="text-xl sm:text-2xl font-bold text-zinc-100" id="count-total">0</div>
      </button>

      <button onclick="setStockFilter('low')" id="stat-low" class="stat-card text-left p-3.5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 transition active:scale-[0.98]">
        <div class="flex items-center justify-between text-zinc-400 text-xs mb-1">
          <span>低庫存</span>
          <i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-amber-400"></i>
        </div>
        <div class="text-xl sm:text-2xl font-bold text-amber-400" id="count-low">0</div>
      </button>

      <button onclick="setStockFilter('out')" id="stat-out" class="stat-card text-left p-3.5 rounded-2xl bg-zinc-900/60 border border-zinc-800/80 hover:border-zinc-700 transition active:scale-[0.98]">
        <div class="flex items-center justify-between text-zinc-400 text-xs mb-1">
          <span>已缺貨</span>
          <i data-lucide="x-circle" class="w-3.5 h-3.5 text-rose-400"></i>
        </div>
        <div class="text-xl sm:text-2xl font-bold text-rose-400" id="count-out">0</div>
      </button>
    </section>

    <!-- 搜尋與位置篩選 -->
    <section class="space-y-3">
      <div class="flex flex-col sm:flex-row gap-2.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" id="search-input" oninput="renderInventory()" placeholder="搜尋備品名稱、存放位置或備註..." class="w-full pl-10 pr-9 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 transition" />
          <button id="clear-search-btn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-zinc-300">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="flex gap-2">
          <div class="relative flex-1 sm:w-52">
            <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <select id="location-filter" onchange="renderInventory()" class="w-full pl-9 pr-8 py-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-200 focus:outline-none focus:border-indigo-500 appearance-none transition">
              <option value="ALL">所有存放位置</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
          <button onclick="openLocationModal()" class="px-3 py-2.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-emerald-400 flex items-center justify-center shrink-0 transition" title="新增或編輯存放位置">
            <i data-lucide="folder-cog" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 分類膠囊列 -->
      <div id="category-pills" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <!-- 由 JS 動態產生 -->
      </div>
    </section>

    <!-- 庫存清單網格 -->
    <section id="inventory-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
      <!-- 由 JS 動態產生 -->
    </section>

    <!-- 空狀態提示 -->
    <section id="empty-state" class="hidden py-16 text-center space-y-3 bg-zinc-900/40 rounded-3xl border border-dashed border-zinc-800">
      <div class="w-12 h-12 rounded-2xl bg-zinc-800/80 text-zinc-400 flex items-center justify-center mx-auto">
        <i data-lucide="package-open" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="text-base font-semibold text-zinc-200">找不到符合的備品</h3>
        <p class="text-xs text-zinc-500 mt-1">試試調整篩選條件，或點擊下方按鈕新增第一筆備品</p>
      </div>
      <button onclick="resetFilters()" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 transition">
        清除所有篩選
      </button>
    </section>
  </main>

  <!-- 手機版懸浮新增按鈕 -->
  <button onclick="openItemModal()" class="sm:hidden fixed right-5 z-30 w-14 h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 active:scale-90 text-white shadow-xl shadow-indigo-600/35 flex items-center justify-center transition" style="bottom: calc(1.25rem + var(--sab));" aria-label="新增備品">
    <i data-lucide="plus" class="w-7 h-7"></i>
  </button>

  <!-- ==================== 1. 新增 / 編輯備品 Modal ==================== -->
  <div id="item-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-0 sm:p-4">
    <div class="animate-modal w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 space-y-4 max-h-[92vh] overflow-y-auto" style="padding-bottom: calc(1.5rem + var(--sab));">
      <div class="flex items-center justify-between">
        <h2 id="item-modal-title" class="text-lg font-bold text-zinc-100">新增備品</h2>
        <button onclick="closeItemModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="item-form" onsubmit="saveItem(event)" class="space-y-4">
        <input type="hidden" id="item-id" />

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">備品名稱 <span class="text-rose-400">*</span></label>
          <input type="text" id="item-name" required placeholder="例如：抽取式衛生紙、3號電池、垃圾袋" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-indigo-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">分類</label>
            <select id="item-category" class="w-full px-3 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-indigo-500">
              <option value="日用衛生">🧻 日用衛生</option>
              <option value="清潔洗劑">🧴 清潔洗劑</option>
              <option value="廚房耗材">🍽️ 廚房耗材</option>
              <option value="3C電池">🔋 3C電池</option>
              <option value="常備醫藥">🩹 常備醫藥</option>
              <option value="食品飲水">🥫 食品飲水</option>
              <option value="其他備品">📦 其他備品</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">單位</label>
            <input type="text" id="item-unit" value="個" placeholder="包 / 瓶 / 顆 / 捲" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <!-- 存放位置選擇與快速新增 -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-medium text-zinc-400">存放位置 <span class="text-rose-400">*</span></label>
            <button type="button" onclick="openLocationModal(true)" class="text-[11px] text-emerald-400 hover:text-emerald-300 font-medium flex items-center gap-1">
              <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
              <span>管理 / 新增位置</span>
            </button>
          </div>
          <div class="relative">
            <select id="item-location-select" required class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-emerald-500 appearance-none">
              <!-- 由 JS 動態填入已建立的存放位置 -->
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-zinc-500 absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">目前剩餘數量</label>
            <input type="number" id="item-qty" min="0" value="1" required class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 font-semibold focus:outline-none focus:border-indigo-500" />
          </div>

          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1.5">安全庫存提醒量</label>
            <input type="number" id="item-min" min="0" value="1" required class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-indigo-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">備註（規格 / 購買通路 / 效期）</label>
          <input type="text" id="item-note" placeholder="選填，例如：好市多科克蘭 120抽" class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 focus:outline-none focus:border-indigo-500" />
        </div>

        <div class="flex items-center gap-2.5 pt-2">
          <button type="button" id="delete-item-btn" onclick="deleteCurrentItem()" class="hidden px-4 py-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 text-rose-400 text-sm font-medium transition">
            刪除
          </button>
          <button type="submit" class="flex-1 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-lg shadow-indigo-600/25 transition">
            儲存備品
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 2. 存放位置管理 Modal（新增 / 編輯 / 刪除） ==================== -->
  <div id="location-modal" class="fixed inset-0 z-[60] hidden items-end sm:items-center justify-center bg-black/80 backdrop-blur-sm p-0 sm:p-4">
    <div class="animate-modal w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto" style="padding-bottom: calc(1.5rem + var(--sab));">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-xl bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
            <i data-lucide="map-pin" class="w-4 h-4"></i>
          </div>
          <div>
            <h2 class="text-base font-bold text-zinc-100">存放位置管理</h2>
            <p class="text-[11px] text-zinc-400">可新增、修改名稱或刪除存放位置</p>
          </div>
        </div>
        <button onclick="closeLocationModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 新增位置表單 -->
      <form onsubmit="addNewLocation(event)" class="flex gap-2">
        <input type="text" id="new-location-input" placeholder="輸入新位置，如：2F浴室鏡櫃..." class="flex-1 px-3.5 py-2.5 rounded-xl bg-zinc-950 border border-zinc-800 text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-emerald-500" />
        <button type="submit" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-semibold flex items-center gap-1 shrink-0 transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>新增</span>
        </button>
      </form>

      <!-- 現有位置清單 -->
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-zinc-400 px-1">
          <span>已建立的存放位置</span>
          <span id="location-total-badge">0 個位置</span>
        </div>
        <div id="location-manage-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-0.5">
          <!-- 由 JS 動態產生 -->
        </div>
      </div>

      <div class="pt-1">
        <button onclick="closeLocationModal()" class="w-full py-2.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold transition">
          完成返回
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== 3. iOS 主畫面圖示自訂 & 資料備份 Modal ==================== -->
  <div id="settings-modal" class="fixed inset-0 z-50 hidden items-end sm:items-center justify-center bg-black/75 backdrop-blur-sm p-0 sm:p-4">
    <div class="animate-modal w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 space-y-5 max-h-[92vh] overflow-y-auto" style="padding-bottom: calc(1.5rem + var(--sab));">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-zinc-100">iOS 主畫面圖示 & 資料備份</h2>
        <button onclick="closeSettingsModal()" class="w-8 h-8 rounded-full bg-zinc-800 text-zinc-400 hover:text-zinc-200 flex items-center justify-center">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- iOS 圖示自訂工作室 -->
      <div class="p-4 rounded-2xl bg-zinc-950 border border-zinc-800/90 space-y-4">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-indigo-400 flex items-center gap-1.5">
            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            自訂 iPhone 主畫面 App 圖示
          </span>
        </div>

        <!-- 模擬 iPhone 桌面預覽 -->
        <div class="flex items-center gap-4 p-3.5 rounded-2xl bg-zinc-900/90 border border-zinc-800">
          <div class="flex flex-col items-center gap-1.5 shrink-0">
            <img id="ios-icon-preview-img" src="" alt="iOS Icon Preview" class="w-16 h-16 rounded-[15px] shadow-lg border border-white/10 object-cover" />
            <span id="ios-icon-preview-label" class="text-[11px] text-zinc-200 font-medium max-w-[72px] truncate">備品庫存</span>
          </div>
          <div class="text-xs text-zinc-400 space-y-1.5 leading-relaxed">
            <p class="text-zinc-200 font-medium">設定步驟（請用 Safari 開啟）：</p>
            <p>1. 自訂下方名稱與圖示並按儲存</p>
            <p>2. 點擊 Safari 底部 <span class="text-indigo-400 font-semibold">分享 ⬆️</span> → <span class="text-indigo-400 font-semibold">加入主畫面</span></p>
          </div>
        </div>

        <!-- App 顯示名稱 -->
        <div>
          <label class="block text-xs text-zinc-400 mb-1">主畫面圖示下方名稱</label>
          <input type="text" id="custom-app-name" maxlength="12" oninput="previewIconSettings()" placeholder="例如：備品庫存、居家管家" class="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-100 text-sm focus:outline-none focus:border-indigo-500" />
        </div>

        <!-- 模式切換：內建圖示 vs 上傳照片 -->
        <div class="grid grid-cols-2 gap-2 p-1 rounded-xl bg-zinc-900 border border-zinc-800">
          <button type="button" id="mode-emoji-btn" onclick="setIconMode('emoji')" class="py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition">
            Emoji / 文字圖示
          </button>
          <button type="button" id="mode-image-btn" onclick="setIconMode('image')" class="py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition">
            上傳相簿圖片
          </button>
        </div>

        <!-- Emoji / 文字模式面板 -->
        <div id="emoji-mode-panel" class="space-y-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1.5">選擇或輸入圖示符號（支援 Emoji 或 1~2 個中英字）</label>
            <div class="flex gap-2">
              <input type="text" id="custom-icon-char" maxlength="2" oninput="previewIconSettings()" value="📦" class="w-16 text-center px-2 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-lg focus:outline-none focus:border-indigo-500" />
              <div class="flex-1 flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                <button type="button" onclick="pickEmoji('📦')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-base shrink-0">📦</button>
                <button type="button" onclick="pickEmoji('🏠')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-base shrink-0">🏠</button>
                <button type="button" onclick="pickEmoji('🧻')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-base shrink-0">🧻</button>
                <button type="button" onclick="pickEmoji('🧴')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-base shrink-0">🧴</button>
                <button type="button" onclick="pickEmoji('🔋')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-base shrink-0">🔋</button>
                <button type="button" onclick="pickEmoji('庫')" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-sm font-bold text-zinc-200 shrink-0">庫</button>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-zinc-400 mb-1.5">背景色系</label>
            <div class="grid grid-cols-6 gap-2" id="gradient-picker">
              <!-- 由 JS 產生漸層色票 -->
            </div>
          </div>
        </div>

        <!-- 上傳圖片模式面板 -->
        <div id="image-mode-panel" class="hidden space-y-2.5">
          <label class="flex flex-col items-center justify-center gap-1.5 py-5 px-4 rounded-xl border border-dashed border-zinc-700 hover:border-indigo-500 bg-zinc-900/60 cursor-pointer transition">
            <i data-lucide="image-plus" class="w-6 h-6 text-indigo-400"></i>
            <span class="text-xs font-medium text-zinc-200">點擊從手機相簿選擇圖片</span>
            <span class="text-[11px] text-zinc-500">自動置中裁切並壓縮為 256×256 PNG</span>
            <input type="file" id="icon-image-upload" accept="image/*" onchange="handleIconImageUpload(event)" class="hidden" />
          </label>
        </div>

        <button type="button" onclick="saveIconSettings()" class="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow-lg shadow-indigo-600/20 transition">
          套用並儲存主畫面圖示
        </button>
      </div>

      <!-- 資料匯出與還原 -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <span class="text-xs font-semibold text-zinc-400">庫存與位置資料備份（JSON）</span>
          <span class="text-[11px] text-zinc-500">建議定期匯出保存</span>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="exportData()" class="flex items-center justify-center gap-2 p-3 rounded-xl bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-medium text-zinc-200 transition">
            <i data-lucide="download" class="w-4 h-4 text-emerald-400"></i>
            <span>匯出備份檔</span>
          </button>

          <label class="flex items-center justify-center gap-2 p-3 rounded-xl bg-zinc-950 hover:bg-zinc-800 border border-zinc-800 text-xs font-medium text-zinc-200 cursor-pointer transition">
            <i data-lucide="upload" class="w-4 h-4 text-sky-400"></i>
            <span>匯入還原</span>
            <input type="file" accept=".json" onchange="importData(event)" class="hidden" />
          </label>
        </div>

        <div class="pt-1 border-t border-zinc-800/80 flex justify-between items-center">
          <span class="text-[11px] text-zinc-500">需要測試範例？</span>
          <button onclick="resetToSampleData()" class="text-[11px] text-amber-400 hover:text-amber-300 underline">
            重置為預設範例資料
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast 通知 -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[70] px-4 py-2.5 rounded-full bg-zinc-800/95 text-zinc-100 text-xs font-medium shadow-xl border border-zinc-700/80 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-200" style="bottom: calc(5.5rem + var(--sab));">
    已更新
  </div>

  <script>
    const STORAGE_KEY = 'home_inventory_v1';
    const LOCATIONS_KEY = 'home_inventory_locations_v1';
    const ICON_SETTINGS_KEY = 'home_inventory_ios_icon_v1';

    const CATEGORIES = ['全部', '日用衛生', '清潔洗劑', '廚房耗材', '3C電池', '常備醫藥', '食品飲水', '其他備品'];
    const CATEGORY_ICONS = {
      '日用衛生': '🧻',
      '清潔洗劑': '🧴',
      '廚房耗材': '🍽️',
      '3C電池': '🔋',
      '常備醫藥': '🩹',
      '食品飲水': '🥫',
      '其他備品': '📦'
    };

    const GRADIENTS = [
      { id: 'indigo', c1: '#6366f1', c2: '#7c3aed', label: '靛紫' },
      { id: 'emerald', c1: '#10b981', c2: '#059669', label: '翠綠' },
      { id: 'amber', c1: '#f59e0b', c2: '#ea580c', label: '琥珀' },
      { id: 'sky', c1: '#0ea5e9', c2: '#2563eb', label: '天藍' },
      { id: 'rose', c1: '#f43f5e', c2: '#db2777', label: '玫紅' },
      { id: 'zinc', c1: '#3f3f46', c2: '#18181b', label: '極簡黑' }
    ];

    const DEFAULT_LOCATIONS = [
      '2F儲藏室層架',
      '1F廚房水槽下',
      '2F浴室鏡櫃',
      '1F電視櫃抽屜',
      '1F玄關鞋櫃上層',
      '1F客廳電視旁櫃子'
    ];

    const SAMPLE_ITEMS = [
      { id: '1', name: '抽取式衛生紙 (串)', category: '日用衛生', location: '2F儲藏室層架', qty: 3, minQty: 2, unit: '串', note: '1串12包', updatedAt: Date.now() },
      { id: '2', name: '洗衣精補充包', category: '清潔洗劑', location: '1F廚房水槽下', qty: 1, minQty: 2, unit: '包', note: '低庫存提醒測試', updatedAt: Date.now() },
      { id: '3', name: '3號鹼性電池 (AA)', category: '3C電池', location: '1F電視櫃抽屜', qty: 8, minQty: 4, unit: '顆', note: '遙控器與滑鼠用', updatedAt: Date.now() },
      { id: '4', name: '中號加厚垃圾袋', category: '廚房耗材', location: '1F廚房水槽下', qty: 0, minQty: 2, unit: '捲', note: '已缺貨，下次採買補貨', updatedAt: Date.now() },
      { id: '5', name: '牙膏', category: '日用衛生', location: '2F浴室鏡櫃', qty: 2, minQty: 1, unit: '條', note: '', updatedAt: Date.now() },
      { id: '6', name: '75% 酒精噴霧補充瓶', category: '常備醫藥', location: '1F玄關鞋櫃上層', qty: 2, minQty: 1, unit: '瓶', note: '', updatedAt: Date.now() }
    ];

    let inventory = [];
    let locations = [];
    let currentCategory = '全部';
    let currentStockFilter = 'all';
    let editingLocationIndex = -1;
    let returnToItemModalAfterLocation = false;

    let iconConfig = {
      appName: '備品庫存',
      mode: 'emoji',
      char: '📦',
      gradientId: 'indigo',
      customImageDataUrl: ''
    };

    // 初始化
    function init() {
      loadIconSettings();
      applyIconToDocument();
      loadLocations();
      loadInventory();
      syncAllLocationLists();
      renderCategories();
      renderGradientPicker();
      renderInventory();
      lucide.createIcons();
    }

    // ==================== 存放位置管理 ====================
    function loadLocations() {
      const saved = localStorage.getItem(LOCATIONS_KEY);
      if (saved) {
        try {
          locations = JSON.parse(saved);
        } catch (e) {
          locations = [...DEFAULT_LOCATIONS];
        }
      } else {
        locations = [...DEFAULT_LOCATIONS];
        saveLocationsToStorage();
      }
    }

    function saveLocationsToStorage() {
      localStorage.setItem(LOCATIONS_KEY, JSON.stringify(locations));
    }

    // 同步首頁篩選下拉、新增備品表單下拉，並將庫存中既有但未在清單的位置補入
    function syncAllLocationLists() {
      let addedFromItems = false;
      inventory.forEach(item => {
        if (item.location && !locations.includes(item.location)) {
          locations.push(item.location);
          addedFromItems = true;
        }
      });
      if (addedFromItems) saveLocationsToStorage();

      // 1. 更新首頁篩選下拉選單
      const filterSelect = document.getElementById('location-filter');
      const prevFilter = filterSelect.value;
      filterSelect.innerHTML = `<option value="ALL">所有存放位置 (${locations.length})</option>` +
        locations.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
      if (locations.includes(prevFilter)) {
        filterSelect.value = prevFilter;
      } else {
        filterSelect.value = 'ALL';
      }

      // 2. 更新新增/編輯備品表單的存放位置下拉選單
      const itemSelect = document.getElementById('item-location-select');
      const prevItemLoc = itemSelect.value;
      if (locations.length === 0) {
        itemSelect.innerHTML = `<option value="">請先新增存放位置</option>`;
      } else {
        itemSelect.innerHTML = locations.map(loc => `<option value="${escapeHtml(loc)}">${escapeHtml(loc)}</option>`).join('');
        if (locations.includes(prevItemLoc)) {
          itemSelect.value = prevItemLoc;
        }
      }
    }

    function openLocationModal(fromItemModal = false) {
      returnToItemModalAfterLocation = fromItemModal;
      editingLocationIndex = -1;
      document.getElementById('new-location-input').value = '';
      renderLocationManageList();

      const modal = document.getElementById('location-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeLocationModal() {
      editingLocationIndex = -1;
      const modal = document.getElementById('location-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      syncAllLocationLists();
      renderInventory();
    }

    function renderLocationManageList() {
      const listEl = document.getElementById('location-manage-list');
      document.getElementById('location-total-badge').textContent = `${locations.length} 個位置`;

      if (locations.length === 0) {
        listEl.innerHTML = `
          <div class="py-8 text-center text-xs text-zinc-500 bg-zinc-950/60 rounded-2xl border border-dashed border-zinc-800">
            尚未建立任何存放位置，請在上方輸入新增
          </div>
        `;
        return;
      }

      listEl.innerHTML = locations.map((loc, idx) => {
        const count = inventory.filter(i => i.location === loc).length;
        const isEditing = editingLocationIndex === idx;

        if (isEditing) {
          return `
            <div class="flex items-center gap-2 p-2.5 rounded-xl bg-zinc-950 border border-emerald-500/60">
              <input type="text" id="edit-loc-input-${idx}" value="${escapeHtml(loc)}" class="flex-1 px-2.5 py-1.5 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-100 text-sm focus:outline-none focus:border-emerald-400" onkeydown="if(event.key==='Enter'){event.preventDefault();saveEditedLocation(${idx});}" />
              <button type="button" onclick="saveEditedLocation(${idx})" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shrink-0">
                儲存
              </button>
              <button type="button" onclick="cancelEditLocation()" class="px-2 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs shrink-0">
                取消
              </button>
            </div>
          `;
        }

        return `
          <div class="flex items-center justify-between gap-2 p-3 rounded-xl bg-zinc-950/90 border border-zinc-800/90 hover:border-zinc-700 transition">
            <div class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="map-pin" class="w-4 h-4 text-emerald-400 shrink-0"></i>
              <span class="text-sm font-medium text-zinc-100 truncate">${escapeHtml(loc)}</span>
              <span class="px-2 py-0.5 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] text-zinc-400 shrink-0">${count} 項</span>
            </div>
            <div class="flex items-center gap-1 shrink-0">
              <button type="button" onclick="startEditLocation(${idx})" class="p-2 rounded-lg text-zinc-400 hover:text-indigo-400 hover:bg-zinc-900 transition" title="編輯名稱">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button type="button" onclick="deleteLocation(${idx})" class="p-2 rounded-lg text-zinc-400 hover:text-rose-400 hover:bg-zinc-900 transition" title="刪除位置">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function addNewLocation(e) {
      e.preventDefault();
      const input = document.getElementById('new-location-input');
      const newLoc = input.value.trim();
      if (!newLoc) return;

      if (locations.includes(newLoc)) {
        showToast('此存放位置已存在');
        return;
      }

      locations.unshift(newLoc);
      saveLocationsToStorage();
      syncAllLocationLists();

      // 若是從新增備品視窗點進來，自動幫使用者選取剛新增的位置
      if (returnToItemModalAfterLocation) {
        document.getElementById('item-location-select').value = newLoc;
      }

      input.value = '';
      renderLocationManageList();
      showToast(`已新增位置：${newLoc}`);
    }

    function startEditLocation(idx) {
      editingLocationIndex = idx;
      renderLocationManageList();
      setTimeout(() => {
        const inp = document.getElementById(`edit-loc-input-${idx}`);
        if (inp) {
          inp.focus();
          inp.select();
        }
      }, 30);
    }

    function cancelEditLocation() {
      editingLocationIndex = -1;
      renderLocationManageList();
    }

    function saveEditedLocation(idx) {
      const inp = document.getElementById(`edit-loc-input-${idx}`);
      if (!inp) return;
      const updatedName = inp.value.trim();
      const oldName = locations[idx];

      if (!updatedName) {
        showToast('位置名稱不能為空');
        return;
      }

      if (updatedName === oldName) {
        editingLocationIndex = -1;
        renderLocationManageList();
        return;
      }

      if (locations.includes(updatedName)) {
        showToast('已有相同的存放位置名稱');
        return;
      }

      // 更新位置陣列並同步更新所有使用該位置的備品
      locations[idx] = updatedName;
      let updatedCount = 0;
      inventory.forEach(item => {
        if (item.location === oldName) {
          item.location = updatedName;
          updatedCount++;
        }
      });

      saveLocationsToStorage();
      saveInventoryToStorage();
      syncAllLocationLists();
      editingLocationIndex = -1;
      renderLocationManageList();
      renderInventory();
      showToast(updatedCount > 0 ? `已更名並同步更新 ${updatedCount} 項備品` : '已更新存放位置名稱');
    }

    function deleteLocation(idx) {
      const targetLoc = locations[idx];
      const relatedItems = inventory.filter(i => i.location === targetLoc);

      if (relatedItems.length > 0) {
        const ok = confirm(`「${targetLoc}」目前還有 ${relatedItems.length} 項備品。\n\n確定要刪除此位置嗎？（這些備品的存放位置將會標記為「未指定位置」）`);
        if (!ok) return;

        if (!locations.includes('未指定位置') && targetLoc !== '未指定位置') {
          locations.push('未指定位置');
        }
        inventory.forEach(item => {
          if (item.location === targetLoc) {
            item.location = '未指定位置';
          }
        });
        saveInventoryToStorage();
      } else {
        if (!confirm(`確定要刪除存放位置「${targetLoc}」嗎？`)) return;
      }

      locations = locations.filter(l => l !== targetLoc);
      saveLocationsToStorage();
      syncAllLocationLists();
      editingLocationIndex = -1;
      renderLocationManageList();
      renderInventory();
      showToast(`已刪除位置：${targetLoc}`);
    }

    // ==================== 庫存資料存取與渲染 ====================
    function loadInventory() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          inventory = JSON.parse(saved);
        } catch (e) {
          inventory = [...SAMPLE_ITEMS];
        }
      } else {
        inventory = [...SAMPLE_ITEMS];
        saveInventoryToStorage();
      }
    }

    function saveInventoryToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
    }

    function renderCategories() {
      const container = document.getElementById('category-pills');
      container.innerHTML = CATEGORIES.map(cat => {
        const active = currentCategory === cat;
        const icon = CATEGORY_ICONS[cat] ? `${CATEGORY_ICONS[cat]} ` : '';
        return `
          <button onclick="setCategory('${cat}')" class="px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition ${
            active
              ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/25'
              : 'bg-zinc-900 text-zinc-400 hover:text-zinc-200 border border-zinc-800'
          }">
            ${icon}${cat}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderInventory();
    }

    function setStockFilter(filter) {
      currentStockFilter = filter;
      document.querySelectorAll('.stat-card').forEach(el => {
        el.classList.remove('border-indigo-500/50', 'ring-1', 'ring-indigo-500/30', 'bg-zinc-900/90');
        el.classList.add('border-zinc-800/80', 'bg-zinc-900/60');
      });
      const activeCard = document.getElementById(`stat-${filter}`);
      activeCard.classList.remove('border-zinc-800/80', 'bg-zinc-900/60');
      activeCard.classList.add('border-indigo-500/50', 'ring-1', 'ring-indigo-500/30', 'bg-zinc-900/90');
      renderInventory();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      renderInventory();
    }

    function resetFilters() {
      currentCategory = '全部';
      currentStockFilter = 'all';
      document.getElementById('search-input').value = '';
      document.getElementById('location-filter').value = 'ALL';
      renderCategories();
      setStockFilter('all');
    }

    function updateStats() {
      const total = inventory.length;
      const out = inventory.filter(i => i.qty === 0).length;
      const low = inventory.filter(i => i.qty > 0 && i.qty <= i.minQty).length;

      document.getElementById('count-total').textContent = total;
      document.getElementById('count-low').textContent = low;
      document.getElementById('count-out').textContent = out;
    }

    function renderInventory() {
      updateStats();

      const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
      const locVal = document.getElementById('location-filter').value;
      document.getElementById('clear-search-btn').classList.toggle('hidden', !searchVal);

      let filtered = inventory.filter(item => {
        const matchCat = currentCategory === '全部' || item.category === currentCategory;
        const matchLoc = locVal === 'ALL' || item.location === locVal;
        const matchSearch = !searchVal ||
          item.name.toLowerCase().includes(searchVal) ||
          item.location.toLowerCase().includes(searchVal) ||
          (item.note && item.note.toLowerCase().includes(searchVal));

        let matchStock = true;
        if (currentStockFilter === 'low') matchStock = item.qty > 0 && item.qty <= item.minQty;
        if (currentStockFilter === 'out') matchStock = item.qty === 0;

        return matchCat && matchLoc && matchSearch && matchStock;
      });

      filtered.sort((a, b) => {
        const getPriority = (item) => {
          if (item.qty === 0) return 0;
          if (item.qty <= item.minQty) return 1;
          return 2;
        };
        const pA = getPriority(a);
        const pB = getPriority(b);
        if (pA !== pB) return pA - pB;
        return b.updatedAt - a.updatedAt;
      });

      const grid = document.getElementById('inventory-grid');
      const emptyState = document.getElementById('empty-state');

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');

      grid.innerHTML = filtered.map(item => {
        const isOut = item.qty === 0;
        const isLow = !isOut && item.qty <= item.minQty;

        let cardBorder = 'border-zinc-800/90 hover:border-zinc-700';
        let badgeHtml = '';
        let qtyColor = 'text-zinc-100';

        if (isOut) {
          cardBorder = 'border-rose-500/40 bg-rose-950/10';
          badgeHtml = `<span class="px-2 py-0.5 rounded-md bg-rose-500/20 text-rose-400 text-[11px] font-semibold">已缺貨</span>`;
          qtyColor = 'text-rose-400';
        } else if (isLow) {
          cardBorder = 'border-amber-500/40 bg-amber-950/10';
          badgeHtml = `<span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 text-[11px] font-semibold">庫存偏低</span>`;
          qtyColor = 'text-amber-400';
        }

        const catIcon = CATEGORY_ICONS[item.category] || '📦';

        return `
          <div class="p-4 rounded-2xl bg-zinc-900/90 border ${cardBorder} flex flex-col justify-between gap-3.5 transition">
            <div class="flex items-start justify-between gap-2">
              <div class="space-y-1.5 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-xs text-zinc-400">${catIcon} ${escapeHtml(item.category)}</span>
                  ${badgeHtml}
                </div>
                <h3 class="text-base font-bold text-zinc-100 leading-snug break-words">${escapeHtml(item.name)}</h3>
              </div>

              <button onclick="openItemModal('${item.id}')" class="p-2 -mr-1.5 -mt-1 rounded-xl text-zinc-500 hover:text-zinc-200 hover:bg-zinc-800 transition shrink-0" title="編輯備品">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
            </div>

            <div class="flex items-center justify-between gap-2 pt-2 border-t border-zinc-800/80">
              <div class="min-w-0 space-y-1">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-zinc-950 border border-zinc-800 text-xs font-medium text-emerald-400 max-w-full">
                  <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
                  <span class="truncate">${escapeHtml(item.location)}</span>
                </div>
                ${item.note ? `<p class="text-[11px] text-zinc-500 truncate pl-0.5">${escapeHtml(item.note)}</p>` : ''}
              </div>

              <div class="flex items-center gap-1.5 bg-zinc-950 p-1 rounded-xl border border-zinc-800 shrink-0">
                <button onclick="adjustQty('${item.id}', -1)" class="w-9 h-9 rounded-lg bg-zinc-900 hover:bg-zinc-800 active:scale-90 text-zinc-300 flex items-center justify-center transition" aria-label="減少數量">
                  <i data-lucide="minus" class="w-4 h-4"></i>
                </button>
                <div class="min-w-[3.2rem] text-center px-1">
                  <span class="text-base font-bold ${qtyColor}">${item.qty}</span>
                  <span class="text-[11px] text-zinc-500 ml-0.5">${escapeHtml(item.unit)}</span>
                </div>
                <button onclick="adjustQty('${item.id}', 1)" class="w-9 h-9 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/35 active:scale-90 text-indigo-400 flex items-center justify-center transition" aria-label="增加數量">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function adjustQty(id, delta) {
      const idx = inventory.findIndex(i => i.id === id);
      if (idx === -1) return;
      const nextQty = Math.max(0, inventory[idx].qty + delta);
      if (nextQty === inventory[idx].qty) return;

      inventory[idx].qty = nextQty;
      inventory[idx].updatedAt = Date.now();
      saveInventoryToStorage();
      renderInventory();
    }

    // ==================== 新增 / 編輯備品 Modal ====================
    function openItemModal(id = null) {
      if (locations.length === 0) {
        locations = ['未指定位置'];
        saveLocationsToStorage();
      }
      syncAllLocationLists();

      const modal = document.getElementById('item-modal');
      const title = document.getElementById('item-modal-title');
      const delBtn = document.getElementById('delete-item-btn');

      if (id) {
        const item = inventory.find(i => i.id === id);
        if (!item) return;
        title.textContent = '編輯備品';
        document.getElementById('item-id').value = item.id;
        document.getElementById('item-name').value = item.name;
        document.getElementById('item-category').value = item.category;
        document.getElementById('item-unit').value = item.unit;
        document.getElementById('item-location-select').value = item.location;
        document.getElementById('item-qty').value = item.qty;
        document.getElementById('item-min').value = item.minQty;
        document.getElementById('item-note').value = item.note || '';
        delBtn.classList.remove('hidden');
      } else {
        title.textContent = '新增備品';
        document.getElementById('item-form').reset();
        document.getElementById('item-id').value = '';
        document.getElementById('item-unit').value = '個';
        document.getElementById('item-qty').value = 1;
        document.getElementById('item-min').value = 1;
        const currentFilterLoc = document.getElementById('location-filter').value;
        if (currentFilterLoc !== 'ALL' && locations.includes(currentFilterLoc)) {
          document.getElementById('item-location-select').value = currentFilterLoc;
        }
        delBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeItemModal() {
      const modal = document.getElementById('item-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function saveItem(e) {
      e.preventDefault();
      const id = document.getElementById('item-id').value;
      const locationVal = document.getElementById('item-location-select').value || '未指定位置';
      const itemData = {
        id: id || Date.now().toString(),
        name: document.getElementById('item-name').value.trim(),
        category: document.getElementById('item-category').value,
        unit: document.getElementById('item-unit').value.trim() || '個',
        location: locationVal,
        qty: Math.max(0, parseInt(document.getElementById('item-qty').value, 10) || 0),
        minQty: Math.max(0, parseInt(document.getElementById('item-min').value, 10) || 0),
        note: document.getElementById('item-note').value.trim(),
        updatedAt: Date.now()
      };

      if (id) {
        const idx = inventory.findIndex(i => i.id === id);
        if (idx !== -1) inventory[idx] = itemData;
        showToast('已更新備品資訊');
      } else {
        inventory.unshift(itemData);
        showToast('已新增備品');
      }

      saveInventoryToStorage();
      syncAllLocationLists();
      renderInventory();
      closeItemModal();
    }

    function deleteCurrentItem() {
      const id = document.getElementById('item-id').value;
      if (!id) return;
      if (!confirm('確定要刪除這筆備品嗎？')) return;

      inventory = inventory.filter(i => i.id !== id);
      saveInventoryToStorage();
      renderInventory();
      closeItemModal();
      showToast('已刪除備品');
    }

    // ==================== iOS 主畫面圖示自訂引擎 ====================
    function loadIconSettings() {
      const saved = localStorage.getItem(ICON_SETTINGS_KEY);
      if (saved) {
        try {
          iconConfig = { ...iconConfig, ...JSON.parse(saved) };
        } catch (e) {}
      }
    }

    function generateIconDataUrl(cfg) {
      if (cfg.mode === 'image' && cfg.customImageDataUrl) {
        return cfg.customImageDataUrl;
      }
      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      const gradObj = GRADIENTS.find(g => g.id === cfg.gradientId) || GRADIENTS[0];
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, gradObj.c1);
      gradient.addColorStop(1, gradObj.c2);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.beginPath();
      ctx.arc(size * 0.85, size * 0.15, size * 0.45, 0, Math.PI * 2);
      ctx.fill();

      const char = (cfg.char || '📦').trim();
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const fontSize = char.length > 1 ? 96 : 124;
      ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif`;
      ctx.fillText(char, size / 2, size / 2 + 6);

      return canvas.toDataURL('image/png');
    }

    function applyIconToDocument() {
      const dataUrl = generateIconDataUrl(iconConfig);
      document.getElementById('apple-touch-icon').setAttribute('href', dataUrl);
      document.getElementById('app-favicon').setAttribute('href', dataUrl);

      const appTitle = iconConfig.appName || '備品庫存';
      document.getElementById('ios-app-title').setAttribute('content', appTitle);
      document.title = appTitle;
      document.getElementById('header-title-text').textContent = appTitle;

      const headerBox = document.getElementById('header-icon-preview');
      if (iconConfig.mode === 'image' && iconConfig.customImageDataUrl) {
        headerBox.style.background = 'none';
        headerBox.innerHTML = `<img src="${iconConfig.customImageDataUrl}" class="w-full h-full rounded-xl object-cover" />`;
      } else {
        const gradObj = GRADIENTS.find(g => g.id === iconConfig.gradientId) || GRADIENTS[0];
        headerBox.style.background = `linear-gradient(135deg, ${gradObj.c1}, ${gradObj.c2})`;
        headerBox.textContent = iconConfig.char || '📦';
      }
    }

    function renderGradientPicker() {
      const container = document.getElementById('gradient-picker');
      container.innerHTML = GRADIENTS.map(g => `
        <button type="button" onclick="pickGradient('${g.id}')" data-grad="${g.id}"
          class="grad-btn h-9 rounded-xl border-2 transition ${iconConfig.gradientId === g.id ? 'border-white scale-105' : 'border-transparent opacity-80 hover:opacity-100'}"
          style="background: linear-gradient(135deg, ${g.c1}, ${g.c2});" title="${g.label}">
        </button>
      `).join('');
    }

    function openSettingsModal() {
      document.getElementById('custom-app-name').value = iconConfig.appName;
      document.getElementById('custom-icon-char').value = iconConfig.char;
      setIconMode(iconConfig.mode, false);
      renderGradientPicker();
      previewIconSettings();

      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function setIconMode(mode, shouldPreview = true) {
      iconConfig.mode = mode;
      const emojiBtn = document.getElementById('mode-emoji-btn');
      const imageBtn = document.getElementById('mode-image-btn');
      const emojiPanel = document.getElementById('emoji-mode-panel');
      const imagePanel = document.getElementById('image-mode-panel');

      if (mode === 'emoji') {
        emojiBtn.className = 'py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition';
        imageBtn.className = 'py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition';
        emojiPanel.classList.remove('hidden');
        imagePanel.classList.add('hidden');
      } else {
        imageBtn.className = 'py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white transition';
        emojiBtn.className = 'py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-zinc-200 transition';
        imagePanel.classList.remove('hidden');
        emojiPanel.classList.add('hidden');
      }
      if (shouldPreview) previewIconSettings();
    }

    function pickEmoji(char) {
      document.getElementById('custom-icon-char').value = char;
      previewIconSettings();
    }

    function pickGradient(gradId) {
      iconConfig.gradientId = gradId;
      renderGradientPicker();
      previewIconSettings();
    }

    function handleIconImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const size = 256;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);

          iconConfig.customImageDataUrl = canvas.toDataURL('image/png', 0.9);
          iconConfig.mode = 'image';
          previewIconSettings();
          showToast('圖片已裁切載入，請點擊「套用並儲存」');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function previewIconSettings() {
      const nameVal = document.getElementById('custom-app-name').value.trim() || '備品庫存';
      const charVal = document.getElementById('custom-icon-char').value.trim() || '📦';
      iconConfig.appName = nameVal;
      iconConfig.char = charVal;

      const previewDataUrl = generateIconDataUrl(iconConfig);
      document.getElementById('ios-icon-preview-img').src = previewDataUrl;
      document.getElementById('ios-icon-preview-label').textContent = nameVal;
    }

    function saveIconSettings() {
      previewIconSettings();
      try {
        localStorage.setItem(ICON_SETTINGS_KEY, JSON.stringify(iconConfig));
        applyIconToDocument();
        showToast('已儲存！請點 Safari 分享 → 加入主畫面');
      } catch (e) {
        showToast('儲存失敗：圖片檔案過大，請換一張或改用 Emoji');
      }
    }

    // ==================== 資料備份與還原（含備品與位置） ====================
    function exportData() {
      const backupPayload = {
        version: 2,
        exportedAt: new Date().toISOString(),
        locations: locations,
        inventory: inventory
      };
      const dataStr = JSON.stringify(backupPayload, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `備品庫存與位置備份_${dateStr}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('已匯出 JSON 備份檔');
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (Array.isArray(parsed)) {
            inventory = parsed;
          } else if (parsed && Array.isArray(parsed.inventory)) {
            inventory = parsed.inventory;
            if (Array.isArray(parsed.locations)) {
              locations = parsed.locations;
              saveLocationsToStorage();
            }
          } else {
            throw new Error('格式不符');
          }
          saveInventoryToStorage();
          syncAllLocationLists();
          renderInventory();
          closeSettingsModal();
          showToast(`成功匯入 ${inventory.length} 筆備品資料`);
        } catch (err) {
          alert('匯入失敗：請確認選擇的是正確的 JSON 備份檔案。');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function resetToSampleData() {
      if (!confirm('這將會覆蓋目前的庫存與位置清單並恢復為預設範例，確定嗎？')) return;
      locations = [...DEFAULT_LOCATIONS];
      inventory = [...SAMPLE_ITEMS];
      saveLocationsToStorage();
      saveInventoryToStorage();
      syncAllLocationLists();
      renderInventory();
      closeSettingsModal();
      showToast('已重置為預設範例資料');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    init();
  </script>
</body>
